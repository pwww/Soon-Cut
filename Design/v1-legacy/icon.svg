<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34368A"/>
      <stop offset="1" stop-color="#14153A"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FF8A70"/>
      <stop offset="1" stop-color="#F0443A"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS 圖示主體：824×824 圓角方形 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <!-- 框選角框（黃色，同剪輯把手） -->
  <g fill="none" stroke="#FFD23F" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 330 V230 H370"/>
    <path d="M654 230 H754 V330"/>
    <path d="M754 640 V740 H654"/>
    <path d="M370 740 H270 V640"/>
  </g>
  <!-- 錄影點 -->
  <circle cx="512" cy="418" r="108" fill="url(#dot)"/>
  <circle cx="512" cy="418" r="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
  <!-- 字幕條 -->
  <rect x="352" y="582" width="320" height="46" rx="23" fill="#FFFFFF"/>
  <rect x="404" y="650" width="216" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
