<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postly — sample site</title>
<style>:root{--accent:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#dde1e8;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#2b3242;overflow:hidden;-webkit-font-smoothing:antialiased}
:root{--win-w:min(1040px,calc(100vw - 440px));--win-h:min(640px,calc(100vh - 140px))}
body.full{--win-w:calc(100vw - 56px)}
.win{position:fixed;left:28px;top:50%;transform:translateY(-50%);width:var(--win-w);height:var(--win-h);background:#fff;border-radius:12px;
  box-shadow:0 24px 60px rgba(25,35,60,.16),0 0 0 1px rgba(20,30,50,.07);display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #eceef2;background:#f7f8fa}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#d6d9df;display:block}
.apptitle{font-weight:650;color:#4a5265;display:flex;align-items:center;gap:8px}
.mark{width:18px;height:18px;border-radius:5px;background:var(--accent);opacity:.9}
.apptitle small{font-weight:500;color:#9aa2b1}
.guide{margin-left:auto;display:flex;align-items:center;gap:8px;color:#6b7385;font-size:12px;font-weight:600}
.guide b{color:var(--accent)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:4px;border-radius:2px;background:#dfe2e8;display:block;transition:background .3s}
.pips i.on{background:var(--accent)}
.sample{font-size:10px;letter-spacing:.09em;font-weight:700;color:#8a93a3;border:1px dashed #b7bfcb;border-radius:999px;padding:2px 8px}
body.nosample .sample{display:none}
.bar{display:inline-block;height:7px;border-radius:4px;background:#e2e5ea;vertical-align:middle}
.bar.d{background:#cfd4dc}
.btn{border:1px solid #dde1e7;background:#fff;border-radius:7px;padding:6px 11px;font:600 12px/1 inherit;font-family:inherit;color:#3a4254;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#98a0ae}
/* guide overlay */
.ring{position:fixed;border:2px solid var(--accent);border-radius:10px;pointer-events:none;transition:all .35s cubic-bezier(.3,.7,.3,1);z-index:50;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 8%,transparent)}}
.callout{position:fixed;width:236px;background:#1e2331;color:#fff;border-radius:12px;padding:12px 14px 13px;z-index:51;pointer-events:none;
  box-shadow:0 12px 30px rgba(10,15,30,.28);transition:left .35s cubic-bezier(.3,.7,.3,1),top .35s cubic-bezier(.3,.7,.3,1),opacity .2s}
.callout .k{display:flex;align-items:center;gap:7px;font-size:11px;color:#a9b2c4;font-weight:600;letter-spacing:.04em}
.callout .n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.callout .t{font-size:15px;font-weight:700;margin-top:6px;line-height:1.25}
.callout .d{font-size:12px;color:#c3cad8;margin-top:3px}
body.nohints .ring,body.nohints .callout{opacity:0!important}
.help{position:fixed;left:28px;bottom:14px;font-size:11.5px;color:#7d8596;background:rgba(255,255,255,.75);padding:5px 10px;border-radius:7px;transition:opacity .5s;z-index:60}
.help.hide{opacity:0}
.help kbd{font:600 10.5px ui-monospace,Menlo,monospace;background:#fff;border:1px solid #d7dbe2;border-radius:4px;padding:0 4px}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#1e2331;color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;
  display:flex;gap:8px;align-items:center;transition:all .35s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ok{width:18px;height:18px;border-radius:50%;background:#22c55e;display:grid;place-items:center;font-size:11px}

.addr{margin-left:6px;flex:1;max-width:420px;height:24px;border-radius:7px;background:#eceef2;display:flex;align-items:center;gap:8px;padding:0 10px;color:#7b8395;font-size:12px}
.addr .lock{width:9px;height:10px;border:1.5px solid #9aa2b1;border-radius:2px}
.page{flex:1;display:flex;min-height:0;background:#f5f6f8}
.nav{width:200px;flex:none;padding:18px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #eceef2;background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin:0 6px 14px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:block}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:8px}
.ni .ic{width:16px;height:16px;border-radius:4px;background:#dfe3e9}
.ni.on{background:#eef3ff}.ni.on .ic{background:var(--accent)}.ni.on b{color:var(--accent)}
.feed{flex:1;overflow:auto;display:flex;justify-content:center;padding:22px 20px}
.col{width:min(540px,100%);display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:16px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#9db7ff,#c9a7ff);flex:none}
.who b{font-size:13.5px}
.cap{margin:12px 0 0;min-height:22px;font-size:14.5px;outline:none;color:#1f2633}
.cap:empty:before{content:attr(data-ph);color:#a2a9b6}
.drop{margin-top:12px;border:2px dashed #cbd2dc;border-radius:12px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#7b8395;transition:all .2s;cursor:pointer}
.drop .big{width:40px;height:40px;border-radius:12px;background:#eef3ff;display:grid;place-items:center}
.drop .big svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{color:#2b3242;font-size:14px}.drop u{color:var(--accent);text-decoration:none;font-weight:600}
body.over .drop{border-color:var(--accent);background:#f1f5ff;transform:scale(1.01)}
.att{display:none;margin-top:12px;position:relative;border-radius:12px;overflow:hidden;background:#0e1118;max-height:330px}
.att video{display:block;width:100%;max-height:330px;object-fit:contain}
.att .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:14px}
.att .up{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,18,28,.72);backdrop-filter:blur(6px);color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600}
.att .row{display:flex;justify-content:space-between;gap:10px}.att .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.track{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}.track i{display:block;height:100%;width:0;background:#60a5fa}
.att.done .up{background:rgba(22,163,74,.85)}.att.done .track{display:none}
body.has .drop{display:none}body.has .att{display:block}
.foot{display:flex;align-items:center;gap:12px;margin-top:14px;color:#9aa2b1}
.foot .tool{width:20px;height:20px;border-radius:5px;background:#eef0f3}
.post{margin-left:auto;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 13px inherit;font-family:inherit;padding:8px 18px;opacity:.4;cursor:default}
body.ready .post{opacity:1;cursor:pointer}
.ghost .bar{display:block;margin-top:8px}.ghost .media{margin-top:12px;height:120px;border-radius:10px;background:#eef0f3}
.live{display:none}body.posted .live{display:block}body.posted .composer{display:none}
.live video{display:block;width:100%;max-height:330px;object-fit:contain;background:#0e1118;border-radius:10px;margin-top:12px}
.live .text{margin-top:10px;font-size:14.5px}.live .meta{color:#9aa2b1;font-size:12px}
.acts{display:flex;gap:18px;margin-top:12px}.acts i{width:18px;height:18px;border-radius:5px;background:#e8eaee;display:block}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(37,99,235,.08);border:3px solid var(--accent);border-radius:0 0 12px 12px;z-index:30;pointer-events:none}
.overlay span{background:var(--accent);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(37,99,235,.35)}
body.over .overlay{display:flex}
.page{position:relative}
.err{color:#dc2626;font-size:12px;margin-top:8px;display:none}
</style></head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="addr"><span class="lock"></span>postly.example/compose</div>
    <span style="margin-left:auto"></span>
    <span class="sample">SAMPLE SITE</span>
  </div>
  <div class="page">
    <nav class="nav">
      <div class="logo"><i></i>Postly</div>
      <div class="ni"><span class="ic"></span><span class="bar " style="width:60px"></span></div>
      <div class="ni"><span class="ic"></span><span class="bar " style="width:48px"></span></div>
      <div class="ni on"><span class="ic"></span><b>New post</b></div>
      <div class="ni"><span class="ic"></span><span class="bar " style="width:70px"></span></div>
      <div class="ni"><span class="ic"></span><span class="bar " style="width:52px"></span></div>
    </nav>
    <main class="feed"><div class="col">
      <div class="card composer">
        <div class="who"><span class="av"></span><div><b>you</b><br><span class="bar " style="width:70px"></span></div></div>
        <div class="cap" id="cap" contenteditable="true" data-ph="Write a caption…"></div>
        <label class="drop" id="drop">
          <span class="big"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></span>
          <b>Drag a video here</b><span>or <u>browse files</u> · MP4 / MOV</span>
          <input type="file" id="file" accept="video/*" hidden>
        </label>
        <div class="err" id="err">That file isn't a video.</div>
        <div class="att" id="att">
          <video id="vid" muted autoplay loop playsinline></video>
          <span class="x" id="rm">✕</span>
          <div class="up"><div class="row"><span class="name" id="fname"></span><span id="pct">0%</span></div><div class="track"><i id="bar"></i></div></div>
        </div>
        <div class="foot"><span class="tool"></span><span class="tool"></span><span class="tool"></span><button class="post" id="post">Post</button></div>
      </div>
      <div class="card live">
        <div class="who"><span class="av"></span><div><b>you</b><div class="meta">Just now</div></div></div>
        <div class="text" id="ltext"></div>
        <video id="lvid" muted autoplay loop playsinline></video>
        <div class="acts"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="card ghost"><div class="who"><span class="av" style="background:#e3e6eb"></span><span class="bar " style="width:90px"></span></div><span class="bar " style="width:380px"></span><span class="bar " style="width:300px"></span><div class="media"></div></div>
      <div class="card ghost"><div class="who"><span class="av" style="background:#e3e6eb"></span><span class="bar " style="width:80px"></span></div><span class="bar " style="width:340px"></span><span class="bar " style="width:220px"></span></div>
    </div></main>
    <div class="overlay"><span>Drop to attach</span></div>
  </div>
  <div class="toast" id="toast"><span class="ok">✓</span>Posted</div>
</div>
<script>
const B=document.body,vid=document.getElementById('vid'),att=document.getElementById('att');
let url=null,timer=null,depth=0;
function reset(){clearInterval(timer);if(url)URL.revokeObjectURL(url);url=null;vid.removeAttribute('src');vid.load();
  B.classList.remove('has','ready','posted','over');att.classList.remove('done');document.getElementById('cap').textContent='';
  document.getElementById('toast').classList.remove('show');document.getElementById('err').style.display='none';}
function attach(f){
  if(!f)return;
  if(!/^video\//.test(f.type)&&!/\.(mp4|mov|m4v|webm)$/i.test(f.name)){const e=document.getElementById('err');e.style.display='block';return;}
  document.getElementById('err').style.display='none';
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);vid.src=url;vid.play().catch(()=>{});
  document.getElementById('fname').textContent=f.name;
  B.classList.add('has');B.classList.remove('ready');att.classList.remove('done');
  // 假上傳：檔案越大跑越久，2～5 秒
  const ms=Math.min(5000,Math.max(2000,f.size/1e6*120));let t0=performance.now();clearInterval(timer);
  timer=setInterval(()=>{let p=Math.min(1,(performance.now()-t0)/ms);p=1-Math.pow(1-p,2.2);
    document.getElementById('bar').style.width=(p*100)+'%';document.getElementById('pct').textContent=p<1?Math.round(p*100)+'%':'Uploaded ✓';
    if(p>=1){clearInterval(timer);att.classList.add('done');B.classList.add('ready');}},50);
}
const isFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(!isFiles(e))return;e.preventDefault();depth++;B.classList.add('over');});
addEventListener('dragover',e=>{if(!isFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';});
addEventListener('dragleave',e=>{if(--depth<=0){depth=0;B.classList.remove('over');}});
addEventListener('drop',e=>{e.preventDefault();depth=0;B.classList.remove('over');if(B.classList.contains('posted'))reset();attach(e.dataTransfer.files[0]);});
document.getElementById('file').addEventListener('change',e=>attach(e.target.files[0]));
document.getElementById('rm').addEventListener('click',()=>{const c=document.getElementById('cap').textContent;reset();document.getElementById('cap').textContent=c;});
document.getElementById('post').addEventListener('click',()=>{
  if(!B.classList.contains('ready'))return;
  document.getElementById('ltext').textContent=document.getElementById('cap').textContent;
  const l=document.getElementById('lvid');l.src=url;l.play().catch(()=>{});
  B.classList.add('posted');const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
});
addEventListener('keydown',e=>{
  if(e.target.isContentEditable)return;const k=e.key.toLowerCase();
  if(k==='r')reset();else if(k==='s')B.classList.toggle('nosample');else if(k==='f')B.classList.toggle('full');
  else if(k==='?'||k==='/')help.classList.toggle('hide');
});
const help=document.createElement('div');help.className='help';
help.innerHTML='Drag a video in · click <b>Post</b> · <kbd>R</kbd> reset · <kbd>S</kbd> sample tag · <kbd>F</kbd> width · <kbd>?</kbd> this help';
B.appendChild(help);setTimeout(()=>help.classList.add('hide'),5000);
</script>
</body></html>
