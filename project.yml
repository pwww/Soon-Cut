name: SoonCut
options:
  bundleIdPrefix: cc.aicolab
  # ⚠️ 開發語言 = en，是**退路語言**：使用者的語言清單跟 App 的語系對不上時，
  # macOS 會退到這一個。設成 zh-Hant 的話，一台只設日文的 Mac 會拿到整頁中文。
  # 這跟字串目錄的 sourceLanguage（zh-Hant，原始碼裡的字串）是兩回事。
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

# 三個組態，對應三種發行方式：
#   Debug     本機開發
#   Release   **開源版**（GPL-3.0，自行編譯）——不沙盒、不浮水印、不含 StoreKit
#   AppStore  Mac App Store 版——沙盒＋強化執行期＋浮水印＋買斷 IAP
#
# ⚠️ 開源版刻意維持原樣：從 GitHub clone 下來的人不需要 Apple 開發者帳號、
#    不需要處理沙盒權限，`xcodebuild -configuration Release` 就能跑。
#    這是 GPL 版本的承諾，不要為了方便把沙盒設定搬到共用區塊。
#   AppStoreDebug  跟 AppStore 一樣的沙盒與付費牆，但可本機執行與除錯
configs:
  Debug: debug
  Release: release
  AppStore: release
  AppStoreDebug: debug

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0

targets:
  SoonCut:
    type: application
    platform: macOS
    sources:
      - path: Sources/SoonCut
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      configs:
        AppStore:
          # ⚠️ 這個旗標以前從來沒有被定義過，所以 `#if APPSTORE` 永遠是 false——
          #    送上去的話免費版不會有浮水印、也不會有付費牆，整組變現靜靜消失。
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
          ENABLE_APP_SANDBOX: YES          # Mac App Store 強制
          ENABLE_HARDENED_RUNTIME: YES     # 公證必需
          CODE_SIGN_ENTITLEMENTS: Sources/SoonCut/SoonCut.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "SoonCut Mac App Store"
        # ⚠️ 這個組態存在的理由：付費牆、沙盒下的螢幕錄影、WhisperKit 模型下載
        # 這三件事都是**無聲失敗**，而 AppStore 組態是 Apple Distribution 手動簽章、
        # 本機跑不起來，等於驗不到。這個組態與它只差簽章方式。
        AppStoreDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE DEBUG
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: Sources/SoonCut/SoonCut.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.aicolab.SoonCut
        PRODUCT_NAME: SoonCut
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 2
        # ⚠️ 只出 arm64。WhisperKit 的模型要 Apple 晶片才跑得動，出通用二進位的話
        #    Intel Mac（macOS 15 還支援一部分）照樣下載得到，然後字幕整組壞掉——
        #    使用者看到的是「這 App 有 bug」，不是「我的機器不支援」。
        #    只出 arm64，App Store 就不會把它推給 Intel Mac。
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES   # 建置時把字串抽進 Localizable.xcstrings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Soon-Cut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Soon-Cut 需要使用麥克風，才能在螢幕錄影時一起錄下你的旁白。"
        INFOPLIST_KEY_NSHumanReadableCopyright: Aicolab LLC
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UAGPUYRAZ3   # 固定簽章，螢幕錄影權限才不會每次重問
        CODE_SIGN_IDENTITY: Apple Development
        # ⚠️ XcodeGen 的 macOS 預設會加 CODE_SIGN_IDENTITY[sdk=macosx*] = "-"（臨時簽章），
        #    而且優先權比上面那行高 → 實際變成 Sign to Run Locally，每次編譯簽章都不同，
        #    螢幕錄影權限就會一直重問。這裡明確蓋掉。
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

# 本機測試買斷流程用。⚠️ 不要在 xcodebuild test 裡驗——StoreKit 測試環境
# 在那條路徑上不生效，會跳出 Apple 登入框把測試卡住（CapyTalk 踩過）。
# 從 Xcode 直接 Run，或 `xcodebuild -scheme SoonCut -configuration AppStore run`。
schemes:
  # 開源版（README 教一般人用的）：⌘R 就是 Debug，沒有浮水印、沒有付費牆
  SoonCut:
    build:
      targets:
        SoonCut: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # App Store 版：測浮水印、付費牆與本機 StoreKit 買斷流程，Archive 上架也用這個
  SoonCut App Store:
    build:
      targets:
        SoonCut: all
    run:
      config: AppStoreDebug
      storeKitConfiguration: SoonCut.storekit
    test:
      config: Debug
    profile:
      config: AppStore
    analyze:
      config: AppStoreDebug
    archive:
      config: AppStore
