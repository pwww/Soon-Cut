name: SoonCut
options:
  bundleIdPrefix: cc.aicolab
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0

targets:
  SoonCut:
    type: application
    platform: macOS
    sources:
      - path: Sources/SoonCut
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.aicolab.SoonCut
        PRODUCT_NAME: SoonCut
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Soon-Cut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Soon-Cut 需要使用麥克風，才能在螢幕錄影時一起錄下你的旁白。"
        INFOPLIST_KEY_NSHumanReadableCopyright: Aicolab LLC
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UAGPUYRAZ3   # 固定簽章，螢幕錄影權限才不會每次重問
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
